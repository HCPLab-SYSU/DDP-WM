defaults:
  - _self_

hydra:
  run:
    dir: plan_outputs/${now:%Y%m%d%H%M%S}_${replace_slash:${model_name}}_gH${goal_H}

# model to load for planning: ${ckpt_base_path}/outputs/${model_name}/checkpoints/model_${model_epoch}.pth
ckpt_base_path: ./checkpoints
model_name: ddpwm_pusht
model_epoch: latest
wandb_logging: false  # results are always written to logs.json
# original DINO-WM PushT checkpoint; its image decoder renders predicted features (tools.decode_features)
feature_decoder_model: ${ckpt_base_path}/outputs/dinowm_pusht

seed: 99
n_evals: 50
goal_source: 'dset'
goal_H: 5 
n_plot_samples: 50

debug_dset_init: False

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1
  base: 2
  mode: last

planner:
  _target_: planning.mpc.MPCPlanner
  max_iter: 3 
  n_taken_actions: 5
  sub_planner:
    target: planning.cem.CEMPlanner
    horizon: 5
    topk: 30
    num_samples: 300
    var_scale: 1
    opt_steps: 30
    eval_every: 1
    use_cost_mask: true  # Sparse MPC Cost Mask (planning/cem.py)
    mask_dilation: 8  # Sparse MPC Cost Mask dilation: 0 (off), 4 or 8 connectivity
  name: mpc_cem

