defaults:
  - _self_
  - env: point_maze
  - motion: ${env}
  - encoder: dino
  - action_encoder: proprio
  - proprio_encoder: proprio
  - decoder: vqvae
  - predictor: ddp_predictor

# Checkpoints are saved to ${ckpt_base_path}/outputs/<run dir> unless hydra.run.dir is given.
ckpt_base_path: ./checkpoints

hydra:
  run:
    dir: ${ckpt_base_path}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

# stage 2 (primary_predictor): the stage-1 checkpoint; stage 3 (lrm): the stage-2 checkpoint
ckpt_path: null

eval_only: false  # only run validation on eval_ckpt_path
eval_ckpt_path: null

training:
  seed: 0
  epochs: 2
  batch_size: 64  # total over all GPUs
  save_every_x_epoch: 1
  encoder_lr: 1e-6
  predictor_lr: 7e-4
  action_encoder_lr: 7e-4

img_size: 224
frameskip: 5
concat_dim: 1

normalize_action: True

# action encoder
action_emb_dim: 10
num_action_repeat: 1

# proprio encoder
proprio_emb_dim: 10
num_proprio_repeat: 1

num_hist: 3  # set to 5 automatically in stages 2 and 3
num_pred: 1  # only supports 1
has_predictor: True
has_decoder: True  # built as in DINO-WM; the DDP-WM world model does not decode images

model:
  _target_: models.ddp_vwm.DDPVWorldModel
  image_size: ${img_size}
  num_hist: ${num_hist}
  num_pred: ${num_pred}
  train_encoder: False
  train_predictor: True
  training_stage: localization  # localization (stage 1), primary_predictor (stage 2) or lrm (stage 3)

debug: False
